#云编译公用核心
name: WRT-CORE

on:
  workflow_call:
    inputs:
      WRT_CONFIG:
        required: true
        type: string
      WRT_THEME:
        required: true
        type: string
      WRT_NAME:
        required: true
        type: string
      WRT_SSID:
        required: true
        type: string
      WRT_WORD:
        required: true
        type: string
      WRT_IP:
        required: true
        type: string
      WRT_PW:
        required: true
        type: string
      WRT_REPO:
        required: true
        type: string
      WRT_BRANCH:
        required: true
        type: string
      WRT_SOURCE:
        required: true
        type: string
      WRT_PACKAGE:
        required: false
        type: string
      WRT_TEST:
        required: false
        default: false
        type: boolean
      WRT_STAGE:
        required: false
        default: firmware
        type: string
      WRT_CHECKPOINT_STAGE:
        required: false
        default: ''
        type: string

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  WRT_CONFIG: ${{inputs.WRT_CONFIG}}
  WRT_THEME: ${{inputs.WRT_THEME}}
  WRT_NAME: ${{inputs.WRT_NAME}}
  WRT_SSID: ${{inputs.WRT_SSID}}
  WRT_WORD: ${{inputs.WRT_WORD}}
  WRT_IP: ${{inputs.WRT_IP}}
  WRT_PW: ${{inputs.WRT_PW}}
  WRT_REPO: ${{inputs.WRT_REPO}}
  WRT_BRANCH: ${{inputs.WRT_BRANCH}}
  WRT_SOURCE: ${{inputs.WRT_SOURCE}}
  WRT_PACKAGE: ${{inputs.WRT_PACKAGE}}
  WRT_TEST: ${{inputs.WRT_TEST}}
  WRT_STAGE: ${{inputs.WRT_STAGE}}

jobs:
  core:
    name: ${{inputs.WRT_SOURCE}} / ${{inputs.WRT_STAGE}}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout Projects
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Reclaim hosted runner disk space
        run: bash Scripts/Athena-runner-space.sh

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt -yqq purge firefox
          sudo -E apt -yqq update
          sudo -E apt -yqq full-upgrade
          sudo -E apt -yqq autoremove --purge
          sudo -E apt -yqq autoclean
          sudo -E apt -yqq clean
          sudo -E apt -yqq install dos2unix libfuse-dev zstd
          sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          sudo -E systemctl daemon-reload
          sudo -E timedatectl set-timezone "Asia/Shanghai"

          sudo mkdir -p /mnt/build_wrt
          sudo chown "$USER:$USER" /mnt/build_wrt
          sudo ln -s /mnt/build_wrt "$GITHUB_WORKSPACE/wrt"

          {
            echo "After build environment initialization"
            df -h / /mnt
          } | tee -a "$GITHUB_WORKSPACE/artifacts/runner-space.txt"

      - name: Initialization Values
        id: initialize-values
        run: |
          WRT_TARGET=$(grep -m 1 -oP '^CONFIG_TARGET_\K[\w]+(?=\=y)' "./Config/$WRT_CONFIG.txt")
          WRT_SUBTARGET=$(grep -m 1 -oP "^CONFIG_TARGET_${WRT_TARGET}_\K[\w]+(?=\=y)" "./Config/$WRT_CONFIG.txt")
          WRT_CACHE_SOURCE=${WRT_SOURCE//\//-}
          WRT_CACHE_BRANCH=${WRT_BRANCH//\//-}
          WRT_CACHE_TARGET="$WRT_TARGET-$WRT_SUBTARGET"
          WRT_CACHE_PREFIX="wrt-$WRT_CACHE_SOURCE-$WRT_CACHE_BRANCH-$WRT_CACHE_TARGET"

          {
            echo "WRT_INFO=${WRT_SOURCE%%/*}"
            echo "WRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")"
            echo "WRT_MARK=${GITHUB_REPOSITORY%%/*}"
            echo "WRT_TARGET=$WRT_TARGET"
            echo "WRT_SUBTARGET=$WRT_SUBTARGET"
            echo "WRT_CACHE_TARGET=$WRT_CACHE_TARGET"
            echo "WRT_CACHE_PREFIX=$WRT_CACHE_PREFIX"
            echo "WRT_WIFI=none"
            echo "WRT_KVER=none"
            echo "WRT_LIST=none"
          } >> "$GITHUB_ENV"
          echo "cache_prefix=$WRT_CACHE_PREFIX" >> "$GITHUB_OUTPUT"

      - name: Select preceding or resumable checkpoint
        id: checkpoint
        if: ${{ inputs.WRT_CHECKPOINT_STAGE != '' || inputs.WRT_STAGE == 'toolchain' }}
        env:
          PRECEDING_STAGE: ${{ inputs.WRT_CHECKPOINT_STAGE }}
        run: |
          stage="$PRECEDING_STAGE"
          if [[ "$WRT_STAGE" == toolchain ]]; then
            name="athena-b-checkpoint-toolchain-$GITHUB_RUN_ID"
            available=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts")
            if jq -e --arg name "$name" '.artifacts[] | select(.name == $name and .expired == false)' \
                <<< "$available" > /dev/null; then
              stage=toolchain
            fi
          fi
          echo "stage=$stage" >> "$GITHUB_OUTPUT"

      - name: Clone Code
        id: clone-code
        if: ${{ steps.checkpoint.outputs.stage == '' }}
        run: |
          WRT_REVISION=$(awk -F '\t' '$1=="source" {print $4}' build.lock.tsv)
          git init ./wrt/
          git -C ./wrt/ remote add origin "$WRT_REPO"
          git -C ./wrt/ fetch --depth=1 origin "$WRT_REVISION"
          git -C ./wrt/ checkout --detach FETCH_HEAD

          cd ./wrt/
          WRT_HASH=$(git rev-parse HEAD)
          echo "WRT_HASH=$WRT_HASH" >> "$GITHUB_ENV"
          echo "WRT_CACHE_KEY=$WRT_CACHE_PREFIX-$WRT_HASH" >> "$GITHUB_ENV"
          echo "cache_key=$WRT_CACHE_PREFIX-$WRT_HASH" >> "$GITHUB_OUTPUT"

          # GitHub Action 移除国内下载源
          PROJECT_MIRRORS_FILE="./scripts/projectsmirrors.json"
          if [ -f "$PROJECT_MIRRORS_FILE" ]; then
            sed -i '/.cn\//d; /tencent/d; /aliyun/d' "$PROJECT_MIRRORS_FILE"
          fi

      - name: Check Scripts
        run: |
          find ./ -maxdepth 3 -type f -iregex ".*\(txt\|sh\)$" -exec dos2unix {} \; -exec chmod +x {} \;

      - name: Download preceding build checkpoint
        if: ${{ steps.checkpoint.outputs.stage != '' }}
        uses: actions/download-artifact@v4
        with:
          name: athena-b-checkpoint-${{ steps.checkpoint.outputs.stage }}-${{ github.run_id }}
          path: checkpoint-download/

      - name: Restore and validate build checkpoint
        if: ${{ steps.checkpoint.outputs.stage != '' }}
        env:
          CHECKPOINT_STAGE: ${{ steps.checkpoint.outputs.stage }}
        run: |
          cd ./wrt/
          bash "$GITHUB_WORKSPACE/Scripts/Athena-checkpoint.sh" restore "$CHECKPOINT_STAGE"

      - name: Prepare Athena locked sources and service defaults
        if: ${{ steps.checkpoint.outputs.stage == '' }}
        run: |
          cd ./wrt/
          bash "$GITHUB_WORKSPACE/Scripts/Athena-prepare.sh"

      - name: Update Feeds
        if: ${{ steps.checkpoint.outputs.stage == '' }}
        run: |
          cd ./wrt/

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Custom Packages
        if: ${{ steps.checkpoint.outputs.stage == '' }}
        run: |
          cd ./wrt/

          "$GITHUB_WORKSPACE/Scripts/Packages.sh"
          "$GITHUB_WORKSPACE/Scripts/Handles.sh"

      - name: Custom Settings
        if: ${{ steps.checkpoint.outputs.stage == '' }}
        run: |
          cd ./wrt/

          if [[ "${WRT_CONFIG,,}" == *"test"* ]]; then
            cat "$GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt" >> .config
          else
            cat "$GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt" "$GITHUB_WORKSPACE/Config/GENERAL.txt" >> .config
          fi

          "$GITHUB_WORKSPACE/Scripts/Settings.sh"

          bash "$GITHUB_WORKSPACE/Scripts/Athena-config.sh"

      - name: Save configuration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: athena-b-config-${{ inputs.WRT_STAGE }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: warn

      - name: Download Packages
        if: ${{ !inputs.WRT_TEST && steps.checkpoint.outputs.stage == '' }}
        run: |
          cd ./wrt/

          make download -j"$(nproc)"

          {
            date -Is
            df -h / .
            du -sh dl
          } > "$GITHUB_WORKSPACE/artifacts/download-space.txt"

      - name: Compile build stage
        id: compile-stage
        if: ${{ !inputs.WRT_TEST }}
        run: |
          cd ./wrt/

          bash "$GITHUB_WORKSPACE/Scripts/Athena-compile.sh"

      - name: Create build checkpoint
        id: checkpoint-create
        if: ${{ !cancelled() && inputs.WRT_STAGE == 'toolchain' && (success() || steps.compile-stage.outcome == 'failure') }}
        run: |
          cd ./wrt/
          bash "$GITHUB_WORKSPACE/Scripts/Athena-checkpoint.sh" save "$WRT_STAGE"

      - name: Save build checkpoint
        if: ${{ !cancelled() && steps.checkpoint-create.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: athena-b-checkpoint-${{ inputs.WRT_STAGE }}-${{ github.run_id }}
          path: checkpoint-upload/
          compression-level: 0
          retention-days: 3
          overwrite: true
          if-no-files-found: error

      - name: Save build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: athena-b-diagnostics-${{ inputs.WRT_STAGE }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: warn

      - name: Machine Information
        run: |
          cd ./wrt/

          echo "======================="
          lscpu | grep -E "name|Core|Thread"
          echo "======================="
          df -h
          echo "======================="
          du -h --max-depth=1
          echo "======================="

      - name: Package Firmware
        if: ${{ !inputs.WRT_TEST && inputs.WRT_STAGE == 'firmware' }}
        run: |
          cd ./wrt/
          bash "$GITHUB_WORKSPACE/Scripts/Athena-package.sh"

      - name: Save image inspection diagnostics
        if: ${{ always() && inputs.WRT_STAGE == 'firmware' }}
        uses: actions/upload-artifact@v4
        with:
          name: athena-b-image-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: warn

      - name: Prepare Release assets
        if: ${{ !inputs.WRT_TEST && inputs.WRT_STAGE == 'firmware' && success() }}
        run: bash Scripts/Athena-release-assets.sh wrt/upload release-upload

      - name: Save firmware artifact
        if: ${{ !inputs.WRT_TEST && inputs.WRT_STAGE == 'firmware' && success() }}
        uses: actions/upload-artifact@v4
        with:
          name: athena-b-firmware-${{ github.run_id }}-${{ github.run_attempt }}
          path: wrt/upload/
          if-no-files-found: error

      - name: Release Firmware
        if: ${{ !inputs.WRT_TEST && inputs.WRT_STAGE == 'firmware' && success() }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: athena-b-${{ github.run_id }}
          target_commitish: ${{ github.sha }}
          files: ./release-upload/*
          body: |
            京东云雅典娜 RE-CS-02 / B版。云端编译产物，设备运行验证待完成。
            框架提交：${{ github.sha }}
            源码：${{ env.WRT_REPO }}
            源码提交：${{ env.WRT_HASH }}
            作者 IPQ60XX-WIFI-YES 基线的受保护配置预检通过。
            固件保留 OpenClash，新增 PassWall2（Xray/Sing-box，nftables），不包含 PassWall 1 或 Shadowsocks Rust。
            首次启动 OpenClash、PassWall2、Docker 均关闭；两套代理按需切换，不同时接管透明代理。
            使用 SHA256SUMS 核对下载文件。升级操作与服务切换见 docs/OPERATIONS.md。
            零字节诊断证据保存在 empty-evidence.tar.gz，原 Actions 产物不变。
