name: Athena VIKINGYFY
run-name: Athena B - ${{ (github.event_name != 'workflow_dispatch' || inputs.preview) && 'defconfig preview' || 'firmware build' }}
on:
  push:
    paths:
      - '.github/workflows/ATHENA.yml'
  workflow_dispatch:
    inputs:
      preview:
        description: Validate configuration and both checkpoint restores; do not compile firmware
        type: boolean
        default: true
        required: true
permissions:
  contents: write
  actions: write
concurrency:
  group: athena-b-${{ github.ref }}
  cancel-in-progress: false
jobs:
  toolchain:
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      WRT_CONFIG: IPQ60XX-WIFI-YES
      WRT_THEME: aurora
      WRT_NAME: OWRT
      WRT_SSID: OWRT
      WRT_WORD: '12345678'
      WRT_IP: 192.168.10.1
      WRT_PW: 无
      WRT_REPO: https://github.com/VIKINGYFY/immortalwrt.git
      WRT_BRANCH: main
      WRT_SOURCE: VIKINGYFY/immortalwrt
      WRT_STAGE: toolchain
      WRT_TEST: ${{ github.event_name != 'workflow_dispatch' || inputs.preview }}
  language:
    needs: toolchain
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      WRT_CONFIG: IPQ60XX-WIFI-YES
      WRT_THEME: aurora
      WRT_NAME: OWRT
      WRT_SSID: OWRT
      WRT_WORD: '12345678'
      WRT_IP: 192.168.10.1
      WRT_PW: 无
      WRT_REPO: https://github.com/VIKINGYFY/immortalwrt.git
      WRT_BRANCH: main
      WRT_SOURCE: VIKINGYFY/immortalwrt
      WRT_STAGE: language
      WRT_CHECKPOINT_STAGE: toolchain
      WRT_TEST: ${{ github.event_name != 'workflow_dispatch' || inputs.preview }}
  athena:
    needs: language
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      WRT_CONFIG: IPQ60XX-WIFI-YES
      WRT_THEME: aurora
      WRT_NAME: OWRT
      WRT_SSID: OWRT
      WRT_WORD: '12345678'
      WRT_IP: 192.168.10.1
      WRT_PW: 无
      WRT_REPO: https://github.com/VIKINGYFY/immortalwrt.git
      WRT_BRANCH: main
      WRT_SOURCE: VIKINGYFY/immortalwrt
      WRT_STAGE: firmware
      WRT_CHECKPOINT_STAGE: language
      WRT_TEST: ${{ github.event_name != 'workflow_dispatch' || inputs.preview }}
